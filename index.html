        function ResourceAllocationTab({ cr, resourceTypes, onUpdate }) {
            const allocations = cr.resourceAllocation || [];

            // Development hours always pulled live from the Objects tab
            const efforts = calculateEfforts(cr.objects || [], cr.overrides || {}, cr.summaryItemCounts || {});
            const devHours = efforts.development || 0;
            const devWeeks = devHours > 0 ? devHours / 40 : 0;

            // Keep `weeks` in sync with dev hours for any row that isn't manually overridden.
            // This is what makes adding/editing Objects automatically increase allocation weeks,
            // and it keeps cr.resourceAllocation[].weeks accurate for Summary/Exports which read it directly.
            useEffect(() => {
                const needsSync = allocations.some(a => a.autoWeeks !== false && a.weeks !== devWeeks);
                if (needsSync) {
                    onUpdate({
                        resourceAllocation: allocations.map(a =>
                            a.autoWeeks !== false ? { ...a, weeks: devWeeks } : a
                        )
                    });
                }
            }, [devWeeks]);

            const addAllocation = () => {
                const usedTypes = allocations.map(a => a.type);
                const nextType = resourceTypes.find(t => !usedTypes.includes(t)) || resourceTypes[0] || 'Consultant';
                const newRow = {
                    id: `alloc_${Date.now()}`,
                    type: nextType,
                    headcount: 1,
                    weeks: devWeeks,
                    autoWeeks: true,   // true = follows dev hours automatically, false = manual override
                    notes: ''
                };
                onUpdate({ resourceAllocation: [...allocations, newRow] });
            };

            const updateAllocation = (id, field, value) => {
                onUpdate({
                    resourceAllocation: allocations.map(a => a.id === id ? { ...a, [field]: value } : a)
                });
            };

            const setManualWeeks = (id, value) => {
                onUpdate({
                    resourceAllocation: allocations.map(a =>
                        a.id === id ? { ...a, autoWeeks: false, weeks: value === '' ? '' : (parseFloat(value) || 0) } : a
                    )
                });
            };

            const resetWeeks = (id) => {
                onUpdate({
                    resourceAllocation: allocations.map(a =>
                        a.id === id ? { ...a, autoWeeks: true, weeks: devWeeks } : a
                    )
                });
            };

            const removeAllocation = (id) => {
                onUpdate({ resourceAllocation: allocations.filter(a => a.id !== id) });
            };

            const getWeeks = (item) => parseFloat(item.weeks) || 0;

            const totalWeeks = allocations.reduce((s, a) => s + getWeeks(a), 0);
            const totalHeadcount = allocations.reduce((s, a) => s + (parseInt(a.headcount) || 0), 0);
            const totalFTE = allocations.reduce((s, a) => s + (devWeeks > 0 ? getWeeks(a) / devWeeks : 0), 0);

            return (
                <div className="content-card">
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
                        <h2>👥 Resource Allocation</h2>
                        <button className="btn btn-primary" onClick={addAllocation}>+ Add Resource</button>
                    </div>
                    <p style={{ color: '#7f8c8d', marginBottom: 20 }}>
                        Weeks are driven automatically by the Development effort on the <strong>Objects</strong> tab
                        ({devHours} hrs ≈ <strong>{devWeeks.toFixed(2)} weeks</strong>). Adding or changing objects will
                        update the allocation below automatically. You can still override weeks per resource if needed.
                    </p>

                    {allocations.length === 0 ? (
                        <div className="empty-state" style={{ padding: 40 }}>
                            <div className="empty-state-icon">👥</div>
                            <div className="empty-state-text">No resources allocated yet</div>
                            <div style={{ color: '#7f8c8d', marginTop: 10 }}>Click "+ Add Resource" to assign consultants to this CR.</div>
                        </div>
                    ) : (
                        <div style={{ overflowX: 'auto' }}>
                            <table className="table">
                                <thead>
                                    <tr>
                                        <th>Consultant Type</th>
                                        <th style={{ textAlign: 'center' }}>Weeks</th>
                                        <th style={{ textAlign: 'center' }}>Headcount</th>
                                        <th style={{ textAlign: 'center' }}>Approx. FTE</th>
                                        <th>Notes</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {allocations.map((item, idx) => {
                                        const isOverride = item.autoWeeks === false;
                                        const weeks = getWeeks(item);
                                        const fte = devWeeks > 0 ? weeks / devWeeks : 0;
                                        return (
                                            <tr key={item.id} style={{ background: idx % 2 === 0 ? '#fff' : '#fafafa' }}>
                                                <td>
                                                    <select
                                                        className="form-select"
                                                        style={{ minWidth: 170 }}
                                                        value={item.type}
                                                        onChange={e => updateAllocation(item.id, 'type', e.target.value)}
                                                    >
                                                        {resourceTypes.map(t => <option key={t} value={t}>{t}</option>)}
                                                    </select>
                                                </td>
                                                <td style={{ textAlign: 'center' }}>
                                                    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 }}>
                                                        <input type="number" min="0" step="0.25"
                                                            style={{ width: 70, textAlign: 'center', fontWeight: 700,
                                                                color: isOverride ? '#e67e22' : '#1e88e5',
                                                                border: `1px solid ${isOverride ? '#e67e22' : '#90caf9'}`,
                                                                borderRadius: 4, padding: '4px 6px' }}
                                                            value={isOverride ? item.weeks : weeks.toFixed(2)}
                                                            onChange={e => setManualWeeks(item.id, e.target.value)}
                                                        />
                                                        {!isOverride && <span style={{ fontSize: 9, color: '#90caf9' }}>auto</span>}
                                                        {isOverride && (
                                                            <button onClick={() => resetWeeks(item.id)}
                                                                style={{ fontSize: 9, color: '#e74c3c', background: 'none', border: 'none', cursor: 'pointer', padding: 0 }}>
                                                                reset
                                                            </button>
                                                        )}
                                                    </div>
                                                </td>
                                                <td style={{ textAlign: 'center' }}>
                                                    <input type="number" min="1"
                                                        style={{ width: 60, textAlign: 'center', border: '1px solid #e0e0e0', borderRadius: 4, padding: '4px 6px' }}
                                                        value={item.headcount}
                                                        onChange={e => updateAllocation(item.id, 'headcount', e.target.value)}
                                                    />
                                                </td>
                                                <td style={{ textAlign: 'center', fontWeight: 600, color: '#0d47a1' }}>{fte.toFixed(2)}</td>
                                                <td>
                                                    <input type="text"
                                                        style={{ width: '100%', border: '1px solid #e0e0e0', borderRadius: 4, padding: '4px 6px' }}
                                                        value={item.notes}
                                                        onChange={e => updateAllocation(item.id, 'notes', e.target.value)}
                                                    />
                                                </td>
                                                <td>
                                                    <button onClick={() => removeAllocation(item.id)}
                                                        style={{ background: 'none', border: 'none', color: '#e74c3c', cursor: 'pointer', fontSize: 18 }}>x</button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                                <tfoot>
                                    <tr style={{ background: '#e3f2fd', fontWeight: 700 }}>
                                        <td style={{ color: '#0d47a1' }}>Total</td>
                                        <td style={{ textAlign: 'center', color: '#0d47a1' }}>{totalWeeks.toFixed(2)}</td>
                                        <td style={{ textAlign: 'center', color: '#0d47a1' }}>{totalHeadcount || '—'}</td>
                                        <td style={{ textAlign: 'center', color: '#0d47a1' }}>{totalFTE.toFixed(2)}</td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    )}
                </div>
            );
        }

        function CostAllocation({ cr, rateData, resourceAllocation, resourceSchedule }) {
            const [selectedCurrency, setSelectedCurrency] = useState('USD');
            const efforts = calculateEfforts(cr.objects || [], cr.overrides || {}, cr.summaryItemCounts || {});
            const HOURS_PER_WEEK = 40;

            const calculateResourceCosts = () => {
                if (!resourceAllocation || resourceAllocation.length === 0) {
                    return { byPhase: {}, byResource: {}, summary: {} };
                }

                const phaseBreakdown = {
                    development: efforts.development || 0,
                    unitTesting: efforts.unitTesting || 0,
                    sit: efforts.sit || 0,
                    uat: efforts.uat || 0,
                    requirements: efforts.requirements || 0,
                    documentation: efforts.documentation || 0,
                    migration: efforts.migration || 0,
                    hypercare: efforts.hypercare || 0,
                    contingency: efforts.contingency || 0
                };

                const totalEffortHours = Object.values(phaseBreakdown).reduce((s, h) => s + h, 0);

                const scheduleRowsByType = (resourceSchedule?.rows || []).reduce((acc, row) => {
                    Object.keys(row).filter(k => k !== 'week').forEach(type => {
                        acc[type] = acc[type] || [];
                        acc[type].push(parseFloat(row[type]) || 0);
                    });
                    return acc;
                }, {});
                const resourceHours = {};

                Object.entries(scheduleRowsByType).forEach(([type, weekValues]) => {
                    const allocation = resourceAllocation.find(item => item.type === type) || {};
                    const headcount = Math.max(1, Math.floor(Number(allocation.headcount) || 1));
                    const totalFTEWeeks = weekValues.reduce((sum, v) => sum + v, 0);
                    const hoursAllocated = totalFTEWeeks * HOURS_PER_WEEK;
                    resourceHours[type] = { headcount, scheduledFTEWeeks: totalFTEWeeks, hoursAllocated };
                });

                const totalScheduledHours = Object.values(resourceHours).reduce((s, r) => s + r.hoursAllocated, 0);
                const scalingFactor = totalScheduledHours > 0 ? totalEffortHours / totalScheduledHours : 1;

                const byCostPhase = {};
                Object.entries(phaseBreakdown).forEach(([phase, hours]) => {
                    byCostPhase[phase] = {};
                    Object.keys(resourceHours).forEach(type => {
                        const rate = (rateData[type] && rateData[type][selectedCurrency]) || 0;
                        const phaseHoursForResource = totalScheduledHours > 0
                            ? (resourceHours[type].hoursAllocated / totalScheduledHours) * hours
                            : 0;
                        byCostPhase[phase][type] = {
                            hours: phaseHoursForResource,
                            rate: parseFloat(rate) || 0,
                            cost: phaseHoursForResource * (parseFloat(rate) || 0)
                        };
                    });
                });

                const byCostResource = {};
                Object.entries(resourceHours).forEach(([type, data]) => {
                    const rate = (rateData[type] && rateData[type][selectedCurrency]) || 0;
                    byCostResource[type] = {
                        headcount: data.headcount,
                        scheduledFTEWeeks: data.scheduledFTEWeeks,
                        totalHours: data.hoursAllocated,
                        rate: parseFloat(rate) || 0,
                        totalCost: data.hoursAllocated * (parseFloat(rate) || 0)
                    };
                });

                const summaryByCurrency = {};
                CURRENCIES.forEach(currency => {
                    let total = 0;
                    Object.entries(resourceHours).forEach(([type, data]) => {
                        const rate = (rateData[type] && rateData[type][currency]) || 0;
                        total += data.hoursAllocated * (parseFloat(rate) || 0);
                    });
                    summaryByCurrency[currency] = total;
                });

                return { byPhase: byCostPhase, byResource: byCostResource, summary: summaryByCurrency, totalHours: totalEffortHours, scalingFactor };
            };

            const costData = calculateResourceCosts();

            if (!resourceAllocation || resourceAllocation.length === 0) {
                return (
                    <div className="content-card">
                        <div className="empty-state" style={{ padding: 40 }}>
                            <div className="empty-state-icon">💰</div>
                            <div className="empty-state-text">No Cost Data Available</div>
                            <div style={{ color: '#7f8c8d', marginTop: 15 }}>Please assign resources in Edit CR to calculate costs.</div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="content-card">
                    <div style={{ marginBottom: 30 }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
                            <h2>💰 Cost Allocation Analysis</h2>
                            <select 
                                className="form-select"
                                value={selectedCurrency}
                                onChange={(e) => setSelectedCurrency(e.target.value)}
                                style={{ width: 200 }}
                            >
                                {CURRENCIES.map(cur => (
                                    <option key={cur} value={cur}>{cur}</option>
                                ))}
                            </select>
                        </div>
                        <p style={{ color: '#7f8c8d' }}>
                            Cost breakdown based on effort hours ({costData.totalHours} hrs total), resource allocation, and hourly rates.
                            {costData.scalingFactor !== 1 && ` Scaling factor applied: ${costData.scalingFactor.toFixed(2)}`}
                        </p>
                    </div>

                    <div className="summary-grid" style={{ marginBottom: 30 }}>
                        {CURRENCIES.map(cur => (
                            <div key={cur} className="summary-card primary" style={{ background: cur === selectedCurrency ? 'linear-gradient(135deg, #1e88e5 0%, #1565c0 100%)' : '#ecf0f1' }}>
                                <div className="summary-label" style={{ color: cur === selectedCurrency ? 'white' : '#546e7a' }}>Total Cost ({cur})</div>
                                <div className="summary-value" style={{ color: cur === selectedCurrency ? 'white' : '#1e88e5' }}>
                                    {(costData.summary[cur] || 0).toFixed(2)}
                                    <span className="summary-unit" style={{ marginLeft: 8 }}>{cur}</span>
                                </div>
                            </div>
                        ))}
                    </div>

                    <h3 style={{ marginBottom: 20 }}>Cost by Resource Type</h3>
                    <div style={{ overflowX: 'auto', marginBottom: 30 }}>
                        <table className="table" style={{ minWidth: 800 }}>
                            <thead>
                                <tr>
                                    <th>Resource Type</th>
                                    <th>Headcount</th>
                                    <th>Scheduled FTE Weeks</th>
                                    <th>Total Hours (40 hrs/week)</th>
                                    <th>Rate ({selectedCurrency}/hr)</th>
                                    <th>Total Cost ({selectedCurrency})</th>
                                </tr>
                            </thead>
                            <tbody>
                                {Object.entries(costData.byResource).map(([resourceType, data], idx) => (
                                    <tr key={resourceType} style={{ background: idx % 2 === 0 ? '#FFFFFF' : '#F5F8FF' }}>
                                        <td style={{ fontWeight: 600 }}>{resourceType}</td>
                                        <td style={{ textAlign: 'center' }}>{data.headcount}</td>
                                        <td style={{ textAlign: 'center' }}>{data.scheduledFTEWeeks.toFixed(2)}</td>
                                        <td style={{ textAlign: 'center' }}>{data.totalHours.toFixed(0)}</td>
                                        <td style={{ textAlign: 'right' }}>{selectedCurrency} {data.rate.toFixed(2)}</td>
                                        <td style={{ textAlign: 'right', fontWeight: 600, color: '#0d47a1' }}>{selectedCurrency} {data.totalCost.toFixed(2)}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <h3 style={{ marginBottom: 20 }}>Cost by Effort Phase</h3>
                    <div style={{ overflowX: 'auto' }}>
                        <table className="table" style={{ minWidth: 1000 }}>
                            <thead>
                                <tr>
                                    <th>Phase</th>
                                    {resourceAllocation.map(item => (
                                        <th key={item.type} style={{ textAlign: 'center', minWidth: 140 }}>{item.type}</th>
                                    ))}
                                    <th style={{ textAlign: 'center' }}>Total Phase Cost</th>
                                </tr>
                            </thead>
                            <tbody>
                                {(() => {
                                    const PHASE_ORDER = ['requirements','documentation','development','unitTesting','sit','uat','migration','hypercare','contingency'];
                                    const PHASE_LABELS = {
                                        requirements: 'Requirement Gathering',
                                        documentation: 'Documentation',
                                        development: 'Development',
                                        unitTesting: 'Unit Testing',
                                        sit: 'System Integration Testing',
                                        uat: 'User Acceptance Testing',
                                        migration: 'Production Migration',
                                        hypercare: 'Hypercare',
                                        contingency: 'Contingency'
                                    };
                                    return PHASE_ORDER.map((phase, idx) => {
                                        const resourceCosts = (costData.byPhase && costData.byPhase[phase]) || {};
                                        const phaseTotalCost = Object.values(resourceCosts).reduce((s, rc) => s + (rc.cost || 0), 0);
                                        const phaseLabel = PHASE_LABELS[phase] || phase;
                                        return (
                                            <tr key={phase} style={{ background: idx % 2 === 0 ? '#FFFFFF' : '#F5F8FF' }}>
                                                <td style={{ fontWeight: 600 }}>{phaseLabel}</td>
                                                {resourceAllocation.map(item => {
                                                    const rc = resourceCosts[item.type] || { hours: 0, cost: 0 };
                                                    return (
                                                        <td key={item.type} style={{ textAlign: 'center', fontSize: 13 }}>
                                                            <div>{selectedCurrency} {rc.cost.toFixed(2)}</div>
                                                            <div style={{ fontSize: 11, color: '#7f8c8d' }}>({rc.hours.toFixed(0)} hrs)</div>
                                                        </td>
                                                    );
                                                })}
                                                <td style={{ textAlign: 'right', fontWeight: 600, color: '#0d47a1' }}>{selectedCurrency} {phaseTotalCost.toFixed(2)}</td>
                                            </tr>
                                        );
                                    });
                                })()}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function Analytics({ crs }) {
            if (crs.length === 0) {
                return (
                    <div className="content-card">
                        <div className="empty-state">
                            <div className="empty-state-icon">📈</div>
                            <div className="empty-state-text">No data available for analytics</div>
                            <p style={{ color: '#95a5a6' }}>Create some CRs to see analytics and insights</p>
                        </div>
                    </div>
                );
            }

            const totalCRs = crs.length;
            const totalEfforts = crs.reduce((sum, cr) => {
                const efforts = calculateEfforts(cr.objects || [], cr.overrides || {}, cr.summaryItemCounts || {});
                return sum + efforts.total;
            }, 0);
            const avgEffort = Math.round(totalEfforts / totalCRs);
            const totalObjects = crs.reduce((sum, cr) => sum + (cr.objects?.length || 0), 0);

            // Status distribution
            const statusCounts = STATUSES.reduce((acc, status) => {
                acc[status] = crs.filter(cr => cr.status === status).length;
                return acc;
            }, {});

            // Object type distribution
            const objectTypeCounts = {};
            crs.forEach(cr => {
                cr.objects?.forEach(obj => {
                    objectTypeCounts[obj.type] = (objectTypeCounts[obj.type] || 0) + 1;
                });
            });

            return (
                <div className="content-card">
                    <h2 style={{ marginBottom: 30 }}>Analytics Dashboard</h2>

                    <div className="summary-grid">
                        <div className="summary-card primary">
                            <div className="summary-label">Total CRs</div>
                            <div className="summary-value">{totalCRs}</div>
                        </div>
                        <div className="summary-card success">
                            <div className="summary-label">Total Effort</div>
                            <div className="summary-value">{totalEfforts} <span className="summary-unit">hrs</span></div>
                        </div>
                        <div className="summary-card warning">
                            <div className="summary-label">Avg Effort/CR</div>
                            <div className="summary-value">{avgEffort} <span className="summary-unit">hrs</span></div>
                        </div>
                        <div className="summary-card danger">
                            <div className="summary-label">Total Objects</div>
                            <div className="summary-value">{totalObjects}</div>
                        </div>
                    </div>

                    <div style={{ marginTop: 40 }}>
                        <h3 style={{ marginBottom: 20 }}>Status Distribution</h3>
                        <table className="table">
                            <thead>
                                <tr>
                                    <th>Status</th>
                                    <th>Count</th>
                                    <th>Percentage</th>
                                </tr>
                            </thead>
                            <tbody>
                                {STATUSES.map(status => (
                                    <tr key={status}>
                                        <td>
                                            <span className={`status-badge status-${status.toLowerCase().replace(' ', '-')}`}>
                                                {status}
                                            </span>
                                        </td>
                                        <td>{statusCounts[status]}</td>
                                        <td>{Math.round((statusCounts[status] / totalCRs) * 100)}%</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <div style={{ marginTop: 40 }}>
                        <h3 style={{ marginBottom: 20 }}>Object Type Usage</h3>
                        <table className="table">
                            <thead>
                                <tr>
                                    <th>Object Type</th>
                                    <th>Count</th>
                                    <th>% of Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                {Object.entries(objectTypeCounts)
                                    .sort((a, b) => b[1] - a[1])
                                    .map(([type, count]) => (
                                        <tr key={type}>
                                            <td>{type}</td>
                                            <td>{count}</td>
                                            <td>{Math.round((count / totalObjects) * 100)}%</td>
                                        </tr>
                                    ))}
                            </tbody>
                        </table>
                    </div>

                    <div style={{ marginTop: 40 }}>
                        <h3 style={{ marginBottom: 20 }}>Recent CRs</h3>
                        <table className="table">
                            <thead>
                                <tr>
                                    <th>CR Number</th>
                                    <th>Title</th>
                                    <th>Client</th>
                                    <th>Status</th>
                                    <th>Effort</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody>
                                {crs.slice(-10).reverse().map(cr => {
                                    const efforts = calculateEfforts(cr.objects || [], cr.overrides || {}, cr.summaryItemCounts || {});
                                    return (
                                        <tr key={cr.id}>
                                            <td>CR-{cr.crNumber}</td>
                                            <td>{cr.title}</td>
                                            <td>{cr.clientName}</td>
                                            <td>
                                                <span className={`status-badge status-${cr.status.toLowerCase().replace(' ', '-')}`}>
                                                    {cr.status}
                                                </span>
                                            </td>
                                            <td>{efforts.total} hrs</td>
                                            <td>{new Date(cr.createdDate).toLocaleDateString()}</td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function ProjectSummary({ crs }) {
            // Group CRs by project
            const projectGroups = crs.reduce((groups, cr) => {
                const projectName = cr.projectName || 'Unassigned';
                if (!groups[projectName]) {
                    groups[projectName] = [];
                }
                groups[projectName].push(cr);
                return groups;
            }, {});

            const calculateProjectEfforts = (projectCrs) => {
                return projectCrs.reduce((total, cr) => {
                    const crEfforts = calculateEfforts(cr.objects || [], cr.overrides || {}, cr.summaryItemCounts || {});
                    return {
                        development: total.development + crEfforts.development,
                        unitTesting: total.unitTesting + crEfforts.unitTesting,
                        sit: total.sit + crEfforts.sit,
                        uat: total.uat + crEfforts.uat,
                        requirements: total.requirements + crEfforts.requirements,
                        documentation: total.documentation + crEfforts.documentation,
                        migration: total.migration + crEfforts.migration,
                        hypercare: total.hypercare + crEfforts.hypercare,
                        contingency: total.contingency + crEfforts.contingency,
                        total: total.total + crEfforts.total,
                        objects: total.objects + (cr.objects?.length || 0)
                    };
                }, {
                    development: 0, unitTesting: 0, sit: 0, uat: 0, requirements: 0,
                    documentation: 0, migration: 0, hypercare: 0, contingency: 0,
                    total: 0, objects: 0
                });
            };

            const formatDecimal = (num) => Math.round(num * 10) / 10;

            return (
                <div className="content-card">
                    <h2 style={{ marginBottom: 20 }}>🏗️ Project Summary</h2>
                    <p style={{ color: '#7f8c8d', marginBottom: 30 }}>
                        Overview of effort distribution across projects and clients
                    </p>

                    {Object.keys(projectGroups).length === 0 ? (
                        <div className="empty-state">
                            <div className="empty-state-icon">📊</div>
                            <div className="empty-state-text">No projects found</div>
                            <p>Create some CRs with project names to see project summaries here.</p>
                        </div>
                    ) : (
                        <div style={{ display: 'grid', gap: 30 }}>
                            {Object.entries(projectGroups).map(([projectName, projectCrs]) => {
                                const efforts = calculateProjectEfforts(projectCrs);
                                const completedCrs = projectCrs.filter(cr => cr.status === 'Completed').length;
                                const totalCrs = projectCrs.length;

                                return (
                                    <div key={projectName} className="object-card" style={{ borderLeft: '4px solid #1e88e5' }}>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start', marginBottom: 20 }}>
                                            <div>
                                                <h3 style={{ marginBottom: 5 }}>{projectName}</h3>
                                                <p style={{ fontSize: 14, color: '#7f8c8d' }}>
                                                    {totalCrs} CR{totalCrs !== 1 ? 's' : ''} • 
                                                    {completedCrs} completed • 
                                                    {efforts.objects} configuration objects
                                                </p>
                                            </div>
                                            <div style={{ textAlign: 'right' }}>
                                                <div style={{ fontSize: 24, fontWeight: 700, color: '#1e88e5' }}>
                                                    {efforts.total} <span style={{ fontSize: 16 }}>hrs</span>
                                                </div>
                                                <div style={{ fontSize: 12, color: '#95a5a6' }}>
                                                    {formatDecimal(efforts.total / 8)} days • {formatDecimal(efforts.total / 40)} weeks
                                                </div>
                                            </div>
                                        </div>

                                        <div className="summary-grid" style={{ marginBottom: 20 }}>
                                            <div className="summary-card primary">
                                                <div className="summary-label">Development</div>
                                                <div className="summary-value">{efforts.development} <span className="summary-unit">hrs</span></div>
                                            </div>
                                            <div className="summary-card success">
                                                <div className="summary-label">Testing</div>
                                                <div className="summary-value">{efforts.unitTesting + efforts.sit + efforts.uat} <span className="summary-unit">hrs</span></div>
                                            </div>
                                            <div className="summary-card warning">
                                                <div className="summary-label">Requirements</div>
                                                <div className="summary-value">{efforts.requirements} <span className="summary-unit">hrs</span></div>
                                            </div>
                                            <div className="summary-card danger">
                                                <div className="summary-label">Objects</div>
                                                <div className="summary-value">{efforts.objects}</div>
                                            </div>
                                        </div>

                                        <div style={{ marginTop: 20 }}>
                                            <h4 style={{ marginBottom: 15 }}>Change Requests in this Project:</h4>
                                            <div style={{ display: 'grid', gap: 10 }}>
                                                {projectCrs.map(cr => (
                                                    <div key={cr.id} style={{
                                                        display: 'flex',
                                                        justifyContent: 'space-between',
                                                        alignItems: 'center',
                                                        padding: 12,
                                                        background: '#f8f9fa',
                                                        borderRadius: 8,
                                                        border: '1px solid #e0e0e0'
                                                    }}>
                                                        <div>
                                                            <div style={{ fontWeight: 600, marginBottom: 4 }}>
                                                                CR-{cr.crNumber}: {cr.title}
                                                            </div>
                                                            <div style={{ fontSize: 12, color: '#7f8c8d' }}>
                                                                {cr.objects?.length || 0} objects • {calculateEfforts(cr.objects || [], cr.overrides || {}, cr.summaryItemCounts || {}).total} hrs • 
                                                                <span className={`status-badge status-${cr.status.toLowerCase().replace(' ', '-')}`}>
                                                                    {cr.status}
                                                                </span>
                                                            </div>
                                                        </div>
                                                        <div style={{ fontSize: 12, color: '#95a5a6' }}>
                                                            {new Date(cr.createdDate).toLocaleDateString()}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        function Templates({ onApplyTemplate }) {
            const [selectedTemplate, setSelectedTemplate] = useState(null);

            const handleApplyTemplate = (template) => {
                setSelectedTemplate(template);
            };

            const calculateTemplateEffort = (template) => {
                let total = 0;
                template.objects.forEach(obj => {
                    total += EFFORT_MATRIX[obj.type]?.[obj.complexity] || 0;
                });
                return total;
            };

            return (
                <div className="content-card">
                    <h2 style={{ marginBottom: 20 }}>📑 Oracle Fusion HCM Seeded Configurations Templates</h2>
                    <p style={{ color: '#7f8c8d', marginBottom: 30 }}>
                        Use these pre-configured templates to quickly create common CR scenarios based on Oracle HCM implementation landscape
                    </p>

                    <div style={{ display: 'grid', gap: 20 }}>
                        {TEMPLATES.map((template, idx) => {
                            const effortEstimate = calculateTemplateEffort(template);
                            return (
                                <div key={idx} className="object-card" style={{ borderLeft: '4px solid #1e88e5' }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start', marginBottom: 15 }}>
                                        <div>
                                            <h3 style={{ marginBottom: 5 }}>{template.name}</h3>
                                            <p style={{ fontSize: 12, color: '#95a5a6', marginBottom: 10 }}>
                                                {template.objects.length} configuration items • ~{effortEstimate} hrs estimated
                                            </p>
                                        </div>
                                    </div>

                                    <div style={{ marginBottom: 15 }}>
                                        <strong style={{ fontSize: 13 }}>Configurations Included:</strong>
                                        <div style={{ 
                                            marginLeft: 20, 
                                            marginTop: 10,
                                            display: 'grid',
                                            gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))',
                                            gap: 8
                                        }}>
                                            {template.objects.map((obj, i) => (
                                                <div key={i} style={{
                                                    background: '#f8f9fa',
                                                    padding: '8px 12px',
                                                    borderRadius: 6,
                                                    fontSize: 13,
                                                    border: '1px solid #e0e0e0'
                                                }}>
                                                    <span style={{ 
                                                        background: '#1e88e5', 
                                                        color: 'white',
                                                        padding: '2px 6px',
                                                        borderRadius: 3,
                                                        fontSize: 11,
                                                        fontWeight: 600,
                                                        marginRight: 8
                                                    }}>
                                                        {obj.type}
                                                    </span>
                                                    {obj.name}
                                                    <span style={{ 
                                                        fontSize: 11,
                                                        color: '#7f8c8d',
                                                        marginLeft: 8
                                                    }}>
                                                        ({obj.complexity})
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <button 
                                        className="btn btn-primary"
                                        onClick={() => handleApplyTemplate(template)}
                                    >
                                        ✅ Apply This Template
                                    </button>

                                    {selectedTemplate === template && (
                                        <div style={{
                                            marginTop: 15,
                                            padding: 15,
                                            background: '#e8f5e9',
                                            borderRadius: 8,
                                            border: '2px solid #4caf50',
                                            color: '#2e7d32',
                                            fontSize: 13
                                        }}>
                                            ✓ Template selected! Create a new CR to use this template.
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function Rates({ resourceTypes, rateData, onUpdateRate, onAddResourceType }) {
            const [newType, setNewType] = useState('');

            return (
                <div className="content-card">
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
                        <div>
                            <h2>💲 Resource Rates</h2>
                            <p style={{ color: '#7f8c8d', marginTop: 8 }}>
                                Manage the base hourly rates for each resource type. These values are used in the Edit CR resource section.
                            </p>
                        </div>
                        <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
                            <input
                                type="text"
                                className="form-input"
                                style={{ width: 220 }}
                                value={newType}
                                placeholder="Add new resource type"
                                onChange={(e) => setNewType(e.target.value)}
                            />
                            <button
                                className="btn btn-primary"
                                type="button"
                                onClick={() => {
                                    const trimmed = newType.trim();
                                    if (!trimmed) return;
                                    onAddResourceType(trimmed);
                                    setNewType('');
                                }}
                            >
                                ➕ Add Type
                            </button>
                        </div>
                    </div>

                    <div style={{ overflowX: 'auto' }}>
                        <table className="table" style={{ minWidth: 840 }}>
                            <thead>
                                <tr>
                                    <th>Resource Type</th>
                                    {CURRENCIES.map(currency => (
                                        <th key={currency}>{currency} / hr</th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody>
                                {resourceTypes.map(type => (
                                    <tr key={type}>
                                        <td style={{ fontWeight: 600, minWidth: 200 }}>{type}</td>
                                        {CURRENCIES.map(currency => (
                                            <td key={currency} style={{ minWidth: 140 }}>
                                                <input
                                                    type="number"
                                                    className="form-input"
                                                    value={(rateData[type] && rateData[type][currency]) || ''}
                                                    onChange={(e) => onUpdateRate(type, currency, e.target.value)}
                                                    min="0"
                                                    step="0.01"
                                                    placeholder="0.00"
                                                />
                                            </td>
                                        ))}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    <div style={{ marginTop: 20, color: '#7f8c8d' }}>
                        Tip: Use this tab to set the base hourly rates in USD, GBP, AUD, and EUR for each resource type. These values will be available in Edit CR.
                    </div>
                </div>
            );
        }

        function CreateCRModal({ onClose, onCreate, currentUser }) {
            const [formData, setFormData] = useState({
                crNumber: `${Date.now().toString().slice(-6)}`,
                title: '',
                clientName: '',
                projectName: '',
                startDate: '',
                description: ''
            });
            const [selectedTemplate, setSelectedTemplate] = useState(null);
            const [templateInstances, setTemplateInstances] = useState(1);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (formData.title && formData.clientName) {
                    let objects = [];
                    if (selectedTemplate) {
                        for (let i = 0; i < templateInstances; i++) {
                            selectedTemplate.objects.forEach(obj => {
                                objects.push({
                                    ...obj,
                                    id: `${obj.type}_${obj.name}_${i}_${Date.now()}_${Math.random()}`,
                                    instance: i + 1,
                                    templateName: selectedTemplate.name
                                });
                            });
                        }
                    }

                    const crData = {
                        ...formData,
                        objects,
                        templateApplied: selectedTemplate ? selectedTemplate.name : null,
                        templateInstances: selectedTemplate ? templateInstances : 1
                    };
                    onCreate(crData);
                    onClose();
                }
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content" onClick={(e) => e.stopPropagation()} style={{ maxHeight: '90vh', overflowY: 'auto' }}>
                        <div className="modal-header">Create New Change Request</div>
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label className="form-label">CR Number</label>
                                <input
                                    type="text"
                                    className="form-input"
                                    value={formData.crNumber}
                                    onChange={(e) => setFormData({ ...formData, crNumber: e.target.value })}
                                    required
                                />
                            </div>
                            <div className="form-group">
                                <label className="form-label">CR Title *</label>
                                <input
                                    type="text"
                                    className="form-input"
                                    value={formData.title}
                                    onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                                    placeholder="e.g., Time Entry Setup for Admin Group"
                                    required
                                />
                            </div>
                            <div className="form-group">
                                <label className="form-label">Client/Project Name *</label>
                                <input
                                    type="text"
                                    className="form-input"
                                    value={formData.clientName}
                                    onChange={(e) => setFormData({ ...formData, clientName: e.target.value })}
                                    placeholder="e.g., Acme Corporation"
                                    required
                                />
                            </div>
                            <div className="form-group">
                                <label className="form-label">Project Start Date</label>
                                <input
                                    type="date"
                                    className="form-input"
                                    value={formData.startDate}
                                    onChange={(e) => setFormData({ ...formData, startDate: e.target.value })}
                                />
                            </div>
                            <div className="form-group">
                                <label className="form-label">Description (Optional)</label>
                                <textarea
                                    className="form-textarea"
                                    value={formData.description}
                                    onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                                    placeholder="Brief description of the change request..."
                                />
                            </div>
                            <div className="form-group">
                                <label className="form-label" style={{ marginBottom: 15 }}>Apply Seeded Configuration Template (Optional)</label>
                                <select
                                    className="form-select"
                                    value={selectedTemplate ? TEMPLATES.indexOf(selectedTemplate) : ''}
                                    onChange={(e) => {
                                        const idx = e.target.value;
                                        setSelectedTemplate(idx !== '' ? TEMPLATES[parseInt(idx, 10)] : null);
                                    }}
                                >
                                    <option value="">-- None (Start with empty CR) --</option>
                                    {TEMPLATES.map((template, idx) => (
                                        <option key={idx} value={idx}>
                                            {template.name} ({template.objects.length} items)
                                        </option>
                                    ))}
                                </select>
                                {selectedTemplate && (
                                    <div style={{
                                        marginTop: 10,
                                        padding: 10,
                                        background: '#e3f2fd',
                                        borderRadius: 6,
                                        fontSize: 12,
                                        color: '#0d47a1',
                                        border: '1px solid #1e88e5'
                                    }}>
                                        ✓ {selectedTemplate.objects.length} configuration items will be added to this CR
                                    </div>
                                )}
                            </div>
                            <div className="modal-footer">
                                <button type="button" className="btn btn-secondary" onClick={onClose}>
                                    Cancel
                                </button>
                                <button type="submit" className="btn btn-primary">
                                    Create CR {selectedTemplate && '+ Apply Template'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        try {
            ReactDOM.render(<App />, document.getElementById('root'));
        } catch (error) {
            console.error('App render error:', error);
            const root = document.getElementById('root');
            if (root) {
                root.innerHTML = `
                    <div style="padding:40px;font-family:Arial, sans-serif;color:#c62828;">
                        <h2>Application failed to load</h2>
                        <p>${error.message}</p>
                        <pre style="white-space:pre-wrap;word-break:break-word;">${error.stack}</pre>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
