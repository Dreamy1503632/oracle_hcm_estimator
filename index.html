                const banner = (text, bgColor, textColor, fontSize = 11, hh = 9) => {
                    checkY(hh + 2);
                    rgb(bgColor); doc.rect(ML, y, TW, hh, 'F');
                    tc(textColor);
                    doc.setFont(undefined, 'bold'); doc.setFontSize(fontSize);
                    doc.text(text, ML + 3, y + hh - 2.5);
                    y += hh + 1;
                };

                // Draw table header row with given columns [{label, w, align}]
                const tableHeader = (cols, bgColor, hh = HDR_H) => {
                    checkY(hh + 2);
                    rgb(bgColor); doc.rect(ML, y, TW, hh, 'F');
                    tc(C.white); doc.setFont(undefined, 'bold'); doc.setFontSize(8.5);
                    let x = ML;
                    cols.forEach(col => {
                        const tx = col.align === 'left' ? x + 2 : x + col.w / 2;
                        doc.text(col.label, tx, y + hh - 2.2, { align: col.align === 'left' ? 'left' : 'center' });
                        x += col.w;
                    });
                    y += hh;
                };

                // Draw a data row; returns new y
                const dataRow = (cells, cols, idx, altA = C.stripA, altB = C.stripB, rh = ROW_H, textColor = C.textDark) => {
                    checkY(rh + 2);
                    const bg = idx % 2 === 0 ? altA : altB;
                    rgb(bg); doc.rect(ML, y, TW, rh, 'F');
                    tc(textColor); doc.setFont(undefined, 'normal'); doc.setFontSize(8);
                    let x = ML;
                    cells.forEach((cell, ci) => {
                        const col = cols[ci];
                        const align = col.align || 'left';
                        const tx = align === 'left' ? x + 2 : x + col.w / 2;
                        const val = cell === null || cell === undefined ? '-' : String(cell);
                        // Truncate long text to avoid overflow
                        const maxChars = Math.floor(col.w / 1.8);
                        const display = val.length > maxChars ? val.slice(0, maxChars - 1) + '.' : val;
                        doc.text(display, tx, y + rh - 1.8, { align });
                        x += col.w;
                    });
                    y += rh;
                };

                // Highlighted total row
                const totalRow = (cells, cols, bgColor, textColor, rh = ROW_H + 1) => {
                    checkY(rh + 2);
                    rgb(bgColor); doc.rect(ML, y, TW, rh, 'F');
                    doc.setDrawColor(C.gold[0], C.gold[1], C.gold[2]);
                    doc.rect(ML, y, TW, rh, 'S');
                    tc(textColor); doc.setFont(undefined, 'bold'); doc.setFontSize(8.5);
                    let x = ML;
                    cells.forEach((cell, ci) => {
                        const col = cols[ci];
                        const align = col.align || 'left';
                        const tx = align === 'left' ? x + 2 : x + col.w / 2;
                        doc.text(String(cell), tx, y + rh - 1.8, { align });
                        x += col.w;
                    });
                    y += rh + 1;
                };

                const gap = (mm = 4) => { y += mm; };

                // ════════════════════════════════════════════════════
                // PAGE 1 - COVER + CR DETAILS + KPI STRIP
                // ════════════════════════════════════════════════════
                y = 10;

                // Banner title
                rgb(C.red); doc.rect(ML, y, TW, 14, 'F');
                tc(C.white); doc.setFont(undefined, 'bold'); doc.setFontSize(16);
                doc.text('HCM EffortIQ', ML + 4, y + 9);
                doc.setFontSize(9); doc.setFont(undefined, 'normal');
                doc.text('Oracle Fusion HCM Implementation - Effort Estimation Report', ML + 4, y + 13.5);
                y += 16; gap(2);

                // CR Details
                banner('Change Request Details', C.red, C.white, 10, 8);
                const crCols = [{ label: 'Field', w: 40, align: 'left' }, { label: 'Value', w: TW - 40, align: 'left' }];
                const statusColors = { 'Draft': [245,124,0], 'In Review': [25,118,210], 'Approved': [56,142,60], 'Completed': [123,31,162] };
                const crRows = [
                    ['CR Number', `CR-${cr.crNumber}`],
                    ['Title', cr.title],
                    ['Client / Project', cr.clientName],
                    ['Status', cr.status],
                    ['Created Date', new Date(cr.createdDate).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })],
                    ['Total Objects', `${cr.objects.length} configuration items`],
                ];
                if (cr.description) crRows.push(['Description', cr.description]);
                crRows.forEach((row, i) => dataRow(row, crCols, i));
                gap(5);

                // KPI strip - 4 boxes
                banner('Key Metrics at a Glance', C.red, C.white, 10, 8);
                const testingTotalPDF = efforts.unitTesting + efforts.sit + efforts.uat;
                const otherTotal = efforts.requirements + efforts.documentation + efforts.migration + efforts.hypercare;
                const kpis = [
                    { label: 'Development', value: `${efforts.development} hrs`, sub: `${formatDecimal(efforts.development/40)} wks`, bg: C.lightBlue, tc: [13,71,161] },
                    { label: 'Testing (UT+SIT+UAT)', value: `${testingTotalPDF} hrs`, sub: `${formatDecimal(testingTotalPDF/40)} wks`, bg: C.lightGreen, tc: [27,94,32] },
                    { label: 'Other Activities', value: `${otherTotal} hrs`, sub: `${formatDecimal(otherTotal/8)} days`, bg: C.amber, tc: [191,54,12] },
                    { label: 'Grand Total', value: `${efforts.total} hrs`, sub: `${formatDecimal(efforts.total/40)} wks`, bg: C.yellow, tc: [199,70,52] },
                ];
                const kpiW = TW / 4;
                const kpiH = 18;
                checkY(kpiH + 2);
                kpis.forEach((k, i) => {
                    rgb(k.bg); doc.rect(ML + i * kpiW, y, kpiW - 1, kpiH, 'F');
                    tc(k.tc); doc.setFont(undefined, 'bold'); doc.setFontSize(8);
                    doc.text(k.label, ML + i * kpiW + kpiW / 2, y + 5, { align: 'center' });
                    doc.setFontSize(15);
                    doc.text(k.value, ML + i * kpiW + kpiW / 2, y + 12, { align: 'center' });
                    doc.setFontSize(7.5); doc.setFont(undefined, 'normal'); tc(C.textMid);
                    doc.text(k.sub, ML + i * kpiW + kpiW / 2, y + 16.5, { align: 'center' });
                });
                y += kpiH + 3;

                // ════════════════════════════════════════════════════
                // EFFORT BREAKDOWN BY ACTIVITY
                // ════════════════════════════════════════════════════
                gap(3);
                banner('Effort Breakdown by Activity', C.red, C.white, 10, 8);
                const effortCols = [
                    { label: 'Activity / Phase', w: 70, align: 'left' },
                    { label: 'Hours', w: 28, align: 'center' },
                    { label: 'Days (8h)', w: 30, align: 'center' },
                    { label: 'Weeks (40h)', w: 35, align: 'center' },
                    { label: '% of Total', w: TW - 163, align: 'center' },
                ];
                tableHeader(effortCols, C.darkSlate);
                const effortRowData = [
                    ['Development', efforts.development, formatDecimal(efforts.development/8), formatDecimal(efforts.development/40), `${efforts.total > 0 ? Math.round(efforts.development/efforts.total*100) : 0}%`],
                    ['Unit Testing', efforts.unitTesting, formatDecimal(efforts.unitTesting/8), formatDecimal(efforts.unitTesting/40), `${efforts.total > 0 ? Math.round(efforts.unitTesting/efforts.total*100) : 0}%`],
                    ['SIT', efforts.sit, formatDecimal(efforts.sit/8), formatDecimal(efforts.sit/40), `${efforts.total > 0 ? Math.round(efforts.sit/efforts.total*100) : 0}%`],
                    ['UAT', efforts.uat, formatDecimal(efforts.uat/8), formatDecimal(efforts.uat/40), `${efforts.total > 0 ? Math.round(efforts.uat/efforts.total*100) : 0}%`],
                    ['Requirements Analysis', efforts.requirements, formatDecimal(efforts.requirements/8), formatDecimal(efforts.requirements/40), `${efforts.total > 0 ? Math.round(efforts.requirements/efforts.total*100) : 0}%`],
                    ['Documentation', efforts.documentation, formatDecimal(efforts.documentation/8), formatDecimal(efforts.documentation/40), `${efforts.total > 0 ? Math.round(efforts.documentation/efforts.total*100) : 0}%`],
                    ['Production Migration', efforts.migration, formatDecimal(efforts.migration/8), formatDecimal(efforts.migration/40), `${efforts.total > 0 ? Math.round(efforts.migration/efforts.total*100) : 0}%`],
                    ['Hypercare Support', efforts.hypercare, formatDecimal(efforts.hypercare/8), formatDecimal(efforts.hypercare/40), `${efforts.total > 0 ? Math.round(efforts.hypercare/efforts.total*100) : 0}%`],
                    ['Contingency (10%)', efforts.contingency, formatDecimal(efforts.contingency/8), formatDecimal(efforts.contingency/40), `${efforts.total > 0 ? Math.round(efforts.contingency/efforts.total*100) : 0}%`],
                ];
                effortRowData.forEach((row, i) => dataRow(row, effortCols, i));
                totalRow(['TOTAL EFFORT', efforts.total, formatDecimal(efforts.total/8), formatDecimal(efforts.total/40), '100%'], effortCols, C.yellow, C.red);

                // ════════════════════════════════════════════════════
                // EFFORT SUMMARY BY OBJECT TYPE
                // ════════════════════════════════════════════════════
                gap(3);
                const typeBreakdownPDF = {};
                cr.objects.forEach(obj => {
                    if (!typeBreakdownPDF[obj.type]) typeBreakdownPDF[obj.type] = { count: 0, hours: 0 };
                    const be = EFFORT_MATRIX[obj.type]?.[obj.complexity] || 0;
                    typeBreakdownPDF[obj.type].count++;
                    typeBreakdownPDF[obj.type].hours += obj.customEffort || be;
                });
                banner('Effort Summary by Object Type', C.navy, C.white, 10, 8);
                const typeCols = [
                    { label: 'Object Type', w: 70, align: 'left' },
                    { label: 'Count', w: 28, align: 'center' },
                    { label: 'Total Hours', w: 35, align: 'center' },
                    { label: 'Avg Hrs / Item', w: 40, align: 'center' },
                    { label: '% of Dev Effort', w: TW - 173, align: 'center' },
                ];
                tableHeader(typeCols, C.navy);
                Object.entries(typeBreakdownPDF).forEach(([type, data], i) => {
                    dataRow([type, data.count, `${data.hours} hrs`, `${formatDecimal(data.hours/data.count)} hrs`, `${efforts.development > 0 ? Math.round(data.hours/efforts.development*100) : 0}%`], typeCols, i);
                });

                // ════════════════════════════════════════════════════
                // CONFIGURATION OBJECTS DETAIL
                // ════════════════════════════════════════════════════
                gap(3);
                checkY(12);
                banner('Configuration Objects -- Detailed Breakdown', C.red, C.white, 10, 8);
                const objCols = [
                    { label: 'Object Type', w: 38, align: 'left' },
                    { label: 'Name / Description', w: 80, align: 'left' },
                    { label: 'Complexity', w: 28, align: 'center' },
                    { label: 'Hours', w: 22, align: 'center' },
                    { label: 'Days', w: 22, align: 'center' },
                    { label: 'Weeks', w: TW - 190, align: 'center' },
                ];
                tableHeader(objCols, C.darkSlate);

                cr.objects.forEach((obj, i) => {
                    const be = EFFORT_MATRIX[obj.type]?.[obj.complexity] || 0;
                    const eh = obj.customEffort || be;
                    dataRow([obj.type, obj.name || '-', obj.complexity, eh, formatDecimal(eh/8), formatDecimal(eh/40)], objCols, i);
                });
                totalRow(['Total Development Effort', '', '', efforts.development, formatDecimal(efforts.development/8), formatDecimal(efforts.development/40)], objCols, C.yellow, C.red);

                // ════════════════════════════════════════════════════
                // RESOURCE ALLOCATION
                // ════════════════════════════════════════════════════
                if (cr.resourceAllocation && cr.resourceAllocation.length > 0) {
                    gap(3); checkY(12);
                    banner('Consultant Resource Allocation', C.red, C.white, 10, 8);
                    const resCols = [
                        { label: 'Consultant Type', w: 65, align: 'left' },
                        { label: 'Weeks', w: 28, align: 'center' },
                        { label: 'Headcount', w: 30, align: 'center' },
                        { label: 'Approx. FTE', w: 35, align: 'center' },
                        { label: 'Notes', w: TW - 158, align: 'left' },
                    ];
                    tableHeader(resCols, C.darkSlate);
                    const dw = efforts.development ? efforts.development / 40 : 0;
                    cr.resourceAllocation.forEach((item, i) => {
                        const fte = item.weeks && dw > 0 ? formatDecimal(item.weeks / dw) : '-';
                        dataRow([item.type, item.weeks ?? '-', item.headcount ?? '-', fte, item.notes || ''], resCols, i);
                    });
                    const tw2 = cr.resourceAllocation.reduce((s, a) => s + (parseFloat(a.weeks) || 0), 0);
                    const th2 = cr.resourceAllocation.reduce((s, a) => s + (parseInt(a.headcount) || 0), 0);
                    const tf2 = cr.resourceAllocation.reduce((s, a) => s + (a.weeks && dw > 0 ? a.weeks / dw : 0), 0);
                    totalRow(['Total', formatDecimal(tw2), th2 || '-', formatDecimal(tf2), ''], resCols, C.lightBlue, C.navy);
                }

                // ════════════════════════════════════════════════════
                // RESOURCE SCHEDULE
                // ════════════════════════════════════════════════════
                if (cr.resourceSchedule && cr.resourceSchedule.rows && cr.resourceSchedule.rows.length > 0 && cr.resourceAllocation && cr.resourceAllocation.length > 0) {
                    gap(3); checkY(12);
                    banner('Resource Schedule (FTE per Week)', C.navy, C.white, 10, 8);
                    const schResources = cr.resourceAllocation;
                    const schColW = Math.min(25, (TW - 18) / (schResources.length + 1));
                    const schCols = [
                        { label: 'Week', w: 18, align: 'center' },
                        ...schResources.map(r => ({ label: r.type.length > 12 ? r.type.slice(0,12)+'...' : r.type, w: schColW, align: 'center' })),
                        { label: 'Total FTE', w: TW - 18 - schColW * schResources.length, align: 'center' },
                    ];
                    tableHeader(schCols, C.navy);
                    cr.resourceSchedule.rows.forEach((row, i) => {
                        const total = schResources.reduce((s, r) => s + (parseFloat(row[r.type]) || 0), 0);
                        dataRow([`W${row.week}`, ...schResources.map(r => row[r.type] ?? 0), formatDecimal(total)], schCols, i);
                    });
                }

                // ════════════════════════════════════════════════════
                // ASSUMPTIONS & NOTES
                // ════════════════════════════════════════════════════
                gap(3); checkY(12);
                banner('Assumptions & Notes', C.red, C.white, 10, 8);
                const notesCols = [{ label: 'Item', w: 50, align: 'left' }, { label: 'Detail', w: TW - 50, align: 'left' }];
                const notesRows = [
                    ['Estimation Basis', 'Oracle Fusion HCM standard effort matrix with complexity-weighted hours per object type.'],
                    ['Testing Ratios', 'Unit Testing: 35% of Dev   |   SIT: 45% of Dev   |   UAT: 30% of Dev'],
                    ['Contingency', '10% buffer applied to total effort for risk and scope variation.'],
                    ['Working Day', '1 Day = 8 Hours   |   1 Week = 40 Hours (5 working days)'],
                    ['Hypercare', 'Fixed 80 hours post-go-live support unless overridden.'],
                ];
                if (cr.notes) notesRows.push(['Additional Notes', cr.notes]);
                notesRows.forEach((row, i) => dataRow(row, notesCols, i));

                // ════════════════════════════════════════════════════
                // SIGN-OFF
                // ════════════════════════════════════════════════════
                gap(4); checkY(30);
                banner('Approval & Sign-Off', C.darkSlate, C.white, 10, 8);
                const signW = TW / 3;
                const signH = 18;
                const signLabels = ['Prepared By', 'Reviewed By', 'Approved By'];
                signLabels.forEach((lbl, i) => {
                    rgb(C.darkSlate); doc.rect(ML + i * signW, y, signW - 1, 7, 'F');
                    tc(C.white); doc.setFont(undefined, 'bold'); doc.setFontSize(8);
                    doc.text(lbl, ML + i * signW + signW / 2, y + 4.5, { align: 'center' });
                });
                y += 7;
                signLabels.forEach((_, i) => {
                    rgb(C.offWhite); doc.rect(ML + i * signW, y, signW - 1, signH, 'F');
                    doc.setDrawColor(200, 200, 200); doc.rect(ML + i * signW, y, signW - 1, signH, 'S');
                });
                y += signH;
                signLabels.forEach((_, i) => {
                    rgb(C.gray); doc.rect(ML + i * signW, y, signW - 1, 6, 'F');
                    tc(C.textMid); doc.setFont(undefined, 'normal'); doc.setFontSize(7);
                    doc.text('Name & Designation / Signature & Date', ML + i * signW + signW / 2, y + 4, { align: 'center' });
                });
                y += 7;

                // Footer on every page
                const totalPages = doc.internal.getNumberOfPages();
                for (let p = 1; p <= totalPages; p++) {
                    doc.setPage(p);
                    rgb(C.gray); doc.rect(0, PH - 7, PW, 7, 'F');
                    tc(C.textMid); doc.setFontSize(7); doc.setFont(undefined, 'normal');
                    doc.text(`Generated by HCM EffortIQ  •  Oracle Fusion HCM  •  ${new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}  •  CR-${cr.crNumber} — ${cr.clientName}`, PW / 2, PH - 3, { align: 'center' });
                    doc.text(`Page ${p} of ${totalPages}`, PW - ML, PH - 3, { align: 'right' });
                }

                doc.save(`CR-${cr.crNumber}_Estimation.pdf`);
            };

            return (
                <div className="content-card">
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 30 }}>
                        <div>
                            <h2>{cr.title}</h2>
                            <p style={{ color: '#7f8c8d', marginTop: 5 }}>CR-{cr.crNumber} • Effort Summary</p>
                        </div>
                        <div className="action-buttons">
                            <button className="btn btn-success" onClick={exportToExcel}>
                                📊 Export Excel
                            </button>
                            <button className="btn btn-primary" onClick={exportToPDF}>
                                📄 Export PDF
                            </button>
                        </div>
                    </div>

                    <div className="summary-grid">
                        <div className="summary-card primary">
                            <div className="summary-label">Total Task Hours</div>
                            <div className="summary-value">{taskTotalHrs||efforts.total} <span className="summary-unit">hrs</span></div>
                        </div>
                        <div className="summary-card success">
                            <div className="summary-label">Development</div>
                            <div className="summary-value">{devHrsFromCR||efforts.development} <span className="summary-unit">hrs</span></div>
                        </div>
                        <div className="summary-card warning">
                            <div className="summary-label">Testing (UT+SIT+UAT)</div>
                            <div className="summary-value">
                                {tasks.filter(t=>['Unit Testing','SIT','UAT'].includes(t.name)).reduce((s,t)=>s+getTaskHrs(t),0) || (efforts.unitTesting+efforts.sit+efforts.uat)}
                                <span className="summary-unit">hrs</span>
                            </div>
                        </div>
                        <div className="summary-card danger">
                            <div className="summary-label">Objects</div>
                            <div className="summary-value">{cr.objects?.length || 0}</div>
                        </div>
                    </div>

                    <div className="chart-container">
                        <h3 style={{ marginBottom: 20 }}>Effort Distribution</h3>
                        <div style={{ height: 400 }}>
                            <canvas ref={chartRef}></canvas>
                        </div>
                    </div>

                    {/* Task Plan Summary */}
                    {tasks.length > 0 && (
                        <div style={{ marginBottom: 40 }}>
                            <h3 style={{ marginBottom: 16 }}>Task Plan Summary</h3>
                            <div style={{ display:'flex', gap:12, marginBottom:18, flexWrap:'wrap' }}>
                                {[
                                    { label:'Sequential Hours', value:`${taskTotalHrs} hrs`, color:'#1e88e5', bg:'#e3f2fd' },
                                    { label:'Parallel Hours (Excl.)', value:taskParallelHrs>0?`${taskParallelHrs} hrs`:'—', color:'#388e3c', bg:'#e8f5e9' },
                                    { label:'Total Days', value:`${(taskTotalHrs/8).toFixed(1)}d`, color:'#f57c00', bg:'#fff3e0' },
                                    { label:'Total Weeks', value:`${(taskTotalHrs/40).toFixed(1)}w`, color:'#7b1fa2', bg:'#f3e5f5' },
                                    { label:'Tasks', value:tasks.length, color:'#c62828', bg:'#ffebee' },
                                ].map(k => (
                                    <div key={k.label} style={{ flex:'1 1 100px', background:k.bg, borderRadius:10, padding:'10px 14px' }}>
                                        <div style={{ fontSize:10, fontWeight:700, color:k.color, textTransform:'uppercase', letterSpacing:0.5 }}>{k.label}</div>
                                        <div style={{ fontSize:18, fontWeight:700, color:k.color, marginTop:3 }}>{k.value}</div>
                                    </div>
                                ))}
                            </div>
                            <table className="table">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Task Name</th>
                                        <th>Effort (hrs)</th>
                                        <th>Parallel</th>
                                        <th>Start Date</th>
                                        <th>End Date</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {tasks.map((task, idx) => {
                                        const hrs = getTaskHrs(task);
                                        const rs = task.startDate || getAutoStart(idx);
                                        const re = task.endDate   || getAutoEnd(idx);
                                        return (
                                            <tr key={task.id} style={{ background: task.parallel ? '#f0fdf4' : (idx%2===0?'#fff':'#f9f9f9') }}>
                                                <td style={{ color:'#b0bec5', fontWeight:600 }}>{idx+1}</td>
                                                <td style={{ fontWeight:600 }}>{task.name||'—'}</td>
                                                <td style={{ color: task.parallel?'#16a34a':'#1e88e5', fontWeight:700, textDecoration:task.parallel?'line-through':'none' }}>
                                                    {hrs>0?`${hrs} hrs`:'—'}
                                                    {task.parallel && <span style={{ marginLeft:6, fontSize:11, background:'#dcfce7', color:'#16a34a', borderRadius:4, padding:'1px 5px' }}>parallel</span>}
                                                </td>
                                                <td>{task.parallel?'Yes':'No'}</td>
                                                <td style={{ color: !task.startDate?'#90caf9':'#2c3e50', fontStyle:!task.startDate?'italic':'normal' }}>{rs||'—'}</td>
                                                <td style={{ color: !task.endDate?'#90caf9':'#2c3e50', fontStyle:!task.endDate?'italic':'normal' }}>{re||'—'}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                                <tfoot>
                                    <tr style={{ background:'#fef9e7', fontWeight:700 }}>
                                        <td colSpan={2} style={{ color:'#c0392b' }}>Total</td>
                                        <td style={{ color:'#1e88e5' }}>{taskTotalHrs} hrs</td>
                                        <td colSpan={3} style={{ color:'#7f8c8d', fontSize:12 }}>{(taskTotalHrs/8).toFixed(1)} days / {(taskTotalHrs/40).toFixed(1)} wks</td>
                                    </tr>
                                </tfoot>
                            </table>

                            {/* FTE by Role */}
                            {ROLES.some(r => roleTotals[r] > 0) && (
                                <div style={{ marginTop:24 }}>
                                    <h4 style={{ marginBottom:12 }}>FTE Allocation by Role</h4>
                                    <table className="table">
                                        <thead>
                                            <tr>
                                                <th>Role</th>
                                                {tasks.map((t,i) => <th key={i} style={{ textAlign:'center', fontSize:11 }}>{t.name||`Task ${i+1}`}</th>)}
                                                <th style={{ textAlign:'center' }}>Total FTE</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {ROLES.filter(r => roleTotals[r]>0).map((role,i) => (
                                                <tr key={role} style={{ background:i%2===0?'#fff':'#f9f9f9' }}>
                                                    <td style={{ fontWeight:600 }}>{role}</td>
                                                    {tasks.map(t => <td key={t.id} style={{ textAlign:'center', color: parseFloat(t.fte?.[role])>0?'#1565c0':'#b0bec5' }}>{parseFloat(t.fte?.[role])||0}</td>)}
                                                    <td style={{ textAlign:'center', fontWeight:700, color:'#1565c0' }}>{roleTotals[role].toFixed(2)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    )}

                    <div>
                        <h3 style={{ marginBottom: 20 }}>Detailed Breakdown</h3>
                        <table className="table">
                            <thead>
                                <tr>
                                    <th>Category</th>
                                    <th>Hours</th>
                                    <th>% of Total</th>

                    {cr.resourceAllocation?.length > 0 && (

                            <h3 style={{ marginBottom: 20 }}>Consultant Resource Allocation</h3>

                                <thead>
                                    <tr>
                                        <th>Consultant Type</th>
                                        <th>Weeks</th>
                                        <th>Headcount</th>
                                        <th>Approx. FTE</th>

                                    {cr.resourceAllocation.map(item => {

                                        return (

                                        const totalWeeks = cr.resourceAllocation.reduce((s, a) => s + (parseFloat(a.weeks) || 0), 0);
                                        const totalHeadcount = cr.resourceAllocation.reduce((s, a) => s + (parseInt(a.headcount) || 0), 0);
                                        const totalFTE = cr.resourceAllocation.reduce((s, a) => s + (a.weeks && devWeeks > 0 ? a.weeks / devWeeks : 0), 0);

                    {cr.notes && (
